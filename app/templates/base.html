<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>{% block title %}RK Depot{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script>
        (() => {
            const savedTheme = localStorage.getItem('rk-depot-theme');
            const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.dataset.theme = savedTheme || systemTheme;
        })();
    </script>
</head>
<body>
    <main id="main-content" class="container">
        <div class="theme-switcher">
            <button type="button" id="theme-toggle" class="outline secondary" aria-pressed="false">
                Mørk modus
            </button>
        </div>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}" role="alert">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>

    <script>
        (() => {
            const toggle = document.getElementById('theme-toggle');
            const root = document.documentElement;

            const updateToggle = () => {
                const isDark = root.dataset.theme === 'dark';
                toggle.textContent = isDark ? 'Lys modus' : 'Mørk modus';
                toggle.setAttribute('aria-pressed', String(isDark));
            };

            toggle.addEventListener('click', () => {
                const nextTheme = root.dataset.theme === 'dark' ? 'light' : 'dark';
                root.dataset.theme = nextTheme;
                localStorage.setItem('rk-depot-theme', nextTheme);
                updateToggle();
            });

            updateToggle();
        })();
    </script>

    <footer>
        <div class="container site-footer">
            <p class="text-muted">
                <a href="{{ url_for('main.index') }}">Ta ut eller lever utstyr</a>
                .
                <a href="/info/staende-ordre/">Stående ordre</a>
                ·
                <a href="{{ url_for('main.privacy') }}">Personvern</a>
                ·
                <a href="{{ url_for('main.about') }}">Om RK Depot</a>
            </p>
        </div>
    </footer>
</body>
</html>
